<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 flex flex-col items-center">

  <div class="w-full max-w-sm bg-gray-800 rounded-xl shadow-xl p-4 space-y-4 border border-gray-700">
    
    <!-- Current Time Header -->
    <div class="text-center border-b border-gray-700 pb-3">
      <div id="current-date" class="text-xs text-gray-400 font-medium">--</div>
      <div id="current-time" class="text-3xl font-bold text-white tracking-wider">--:--:--</div>
    </div>

    <!-- Clock In / Clock Out Controls -->
    <div id="status-card" class="bg-gray-900 rounded-lg p-3 text-center border border-gray-700">
      <div class="text-xs text-gray-400 mb-1">Status</div>
      <div id="status-text" class="text-lg font-bold text-gray-300">Clocked Out</div>
      <div id="active-timer" class="text-sm font-mono text-blue-400 font-semibold mt-1 hidden">Shift Time: 00:00:00</div>
    </div>

    <div class="flex gap-2">
      <button id="clock-in-btn" onclick="clockIn()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg shadow transition text-sm">
        <i class="fa-solid fa-play mr-1"></i> Clock In
      </button>
      <button id="clock-out-btn" onclick="clockOut()" disabled class="flex-1 bg-rose-600 text-white font-bold py-3 rounded-lg shadow opacity-40 cursor-not-allowed transition text-sm">
        <i class="fa-solid fa-stop mr-1"></i> Clock Out
      </button>
    </div>

    <!-- Summary -->
    <div class="flex justify-between items-center bg-blue-950/60 border border-blue-900/50 px-3 py-2 rounded-lg text-xs font-semibold text-blue-300">
      <span>Total Hours Worked:</span>
      <span id="total-hours" class="text-sm font-bold text-blue-200">0.00 hrs</span>
    </div>

    <!-- Logs List -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Shift History</h2>
        <div class="flex gap-1.5">
          <button onclick="deleteAllShifts()" class="text-xs bg-red-950 hover:bg-red-900 text-red-300 border border-red-800 font-semibold px-2 py-1 rounded transition">
            <i class="fa-solid fa-trash"></i> Delete All
          </button>
          <button onclick="exportCSV()" class="text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 font-semibold px-2 py-1 rounded transition">
            <i class="fa-solid fa-download"></i> Export
          </button>
        </div>
      </div>

      <div id="logs-container" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- Log entries render here -->
      </div>
    </div>

  </div>

  <script>
    let shifts = JSON.parse(localStorage.getItem('timeTrackerShifts')) || [];
    let activeShiftIndex = localStorage.getItem('activeShiftIndex') !== null ? parseInt(localStorage.getItem('activeShiftIndex')) : null;
    let timerInterval = null;

    function formatDateFormatted(date) {
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}/${day}/${year}`;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('current-date').innerText = formatDateFormatted(now);
      document.getElementById('current-time').innerText = now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    function saveState() {
      localStorage.setItem('timeTrackerShifts', JSON.stringify(shifts));
      if (activeShiftIndex !== null) {
        localStorage.setItem('activeShiftIndex', activeShiftIndex);
      } else {
        localStorage.removeItem('activeShiftIndex');
      }
      render();
    }

    function clockIn() {
      const now = new Date().toISOString();
      shifts.unshift({ clockIn: now, clockOut: null });
      activeShiftIndex = 0;
      saveState();
    }

    function clockOut() {
      if (activeShiftIndex !== null && shifts[activeShiftIndex]) {
        shifts[activeShiftIndex].clockOut = new Date().toISOString();
        activeShiftIndex = null;
        saveState();
      }
    }

    function deleteClockIn(index) {
      shifts[index].clockIn = null;
      if (!shifts[index].clockIn && !shifts[index].clockOut) {
        shifts.splice(index, 1);
      }
      if (activeShiftIndex === index && shifts[index]?.clockIn === null) {
        activeShiftIndex = null;
      }
      saveState();
    }

    function deleteClockOut(index) {
      shifts[index].clockOut = null;
      if (!shifts[index].clockIn && !shifts[index].clockOut) {
        shifts.splice(index, 1);
      } else if (shifts[index].clockIn) {
        activeShiftIndex = index;
      }
      saveState();
    }

    function deleteShift(index) {
      if (activeShiftIndex === index) {
        activeShiftIndex = null;
      }
      shifts.splice(index, 1);
      saveState();
    }

    function deleteAllShifts() {
      shifts = [];
      activeShiftIndex = null;
      saveState();
    }

    function formatDateTime(isoString) {
      if (!isoString) return '--';
      const d = new Date(isoString);
      const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return `${timeStr} (${formatDateFormatted(d)})`;
    }

    function render() {
      const logsContainer = document.getElementById('logs-container');
      logsContainer.innerHTML = '';

      let totalMilliseconds = 0;

      if (activeShiftIndex !== null && shifts[activeShiftIndex] && shifts[activeShiftIndex].clockIn) {
        document.getElementById('status-text').innerText = "Clocked In";
        document.getElementById('status-text').className = "text-lg font-bold text-emerald-400";
        document.getElementById('clock-in-btn').disabled = true;
        document.getElementById('clock-in-btn').classList.add('opacity-40', 'cursor-not-allowed');
        document.getElementById('clock-out-btn').disabled = false;
        document.getElementById('clock-out-btn').classList.remove('opacity-40', 'cursor-not-allowed');
        document.getElementById('active-timer').classList.remove('hidden');
        startActiveTimer();
      } else {
        document.getElementById('status-text').innerText = "Clocked Out";
        document.getElementById('status-text').className = "text-lg font-bold text-gray-300";
        document.getElementById('clock-in-btn').disabled = false;
        document.getElementById('clock-in-btn').classList.remove('opacity-40', 'cursor-not-allowed');
        document.getElementById('clock-out-btn').disabled = true;
        document.getElementById('clock-out-btn').classList.add('opacity-40', 'cursor-not-allowed');
        document.getElementById('active-timer').classList.add('hidden');
        clearInterval(timerInterval);
      }

      if (shifts.length === 0) {
        logsContainer.innerHTML = `<div class="text-center text-xs text-gray-500 py-4">No logged records yet</div>`;
      }

      shifts.forEach((shift, index) => {
        let durationText = '--';
        if (shift.clockIn && shift.clockOut) {
          const diff = new Date(shift.clockOut) - new Date(shift.clockIn);
          totalMilliseconds += diff;
          const hours = (diff / 3600000).toFixed(2);
          durationText = `${hours} hrs`;
        }

        const card = document.createElement('div');
        card.className = "bg-gray-900 border border-gray-700 rounded-lg p-2.5 flex flex-col gap-1.5 text-xs";
        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-800 pb-1">
            <span class="font-bold text-gray-300">Shift #${shifts.length - index}</span>
            <div class="flex items-center gap-2">
              <span class="font-semibold text-blue-400">${durationText}</span>
              <button onclick="deleteShift(${index})" class="text-rose-400 hover:text-rose-300 transition" title="Delete Shift">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>

          <div class="flex justify-between items-center">
            <div>
              <span class="text-gray-400">In:</span> 
              <span class="font-medium text-gray-200">${formatDateTime(shift.clockIn)}</span>
            </div>
            ${shift.clockIn ? `
              <button onclick="deleteClockIn(${index})" class="text-rose-400 hover:text-rose-300 text-[10px] bg-rose-950/60 border border-rose-800/60 px-1.5 py-0.5 rounded transition">
                Delete In
              </button>
            ` : ''}
          </div>

          <div class="flex justify-between items-center">
            <div>
              <span class="text-gray-400">Out:</span> 
              <span class="font-medium text-gray-200">${formatDateTime(shift.clockOut)}</span>
            </div>
            ${shift.clockOut ? `
              <button onclick="deleteClockOut(${index})" class="text-rose-400 hover:text-rose-300 text-[10px] bg-rose-950/60 border border-rose-800/60 px-1.5 py-0.5 rounded transition">
                Delete Out
              </button>
            ` : ''}
          </div>
        `;
        logsContainer.appendChild(card);
      });

      document.getElementById('total-hours').innerText = (totalMilliseconds / 3600000).toFixed(2) + ' hrs';
    }

    function startActiveTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (activeShiftIndex !== null && shifts[activeShiftIndex] && shifts[activeShiftIndex].clockIn) {
          const diff = new Date() - new Date(shifts[activeShiftIndex].clockIn);
          const hrs = String(Math.floor(diff / 3600000)).padStart(2, '0');
          const mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
          const secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
          document.getElementById('active-timer').innerText = `Shift Time: ${hrs}:${mins}:${secs}`;
        }
      }, 1000);
    }

    function exportCSV() {
      if (shifts.length === 0) return;
      let csv = 'Clock In,Clock Out,Duration (Hours)\n';
      shifts.forEach(shift => {
        const inStr = shift.clockIn ? `${formatDateFormatted(new Date(shift.clockIn))} ${new Date(shift.clockIn).toLocaleTimeString()}` : '';
        const outStr = shift.clockOut ? `${formatDateFormatted(new Date(shift.clockOut))} ${new Date(shift.clockOut).toLocaleTimeString()}` : '';
        let hrs = '';
        if (shift.clockIn && shift.clockOut) {
          hrs = ((new Date(shift.clockOut) - new Date(shift.clockIn)) / 3600000).toFixed(2);
        }
        csv += `"${inStr}","${outStr}","${hrs}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'time_tracker_export.csv';
      a.click();
    }

    render();
  </script>
</body>
</html>
